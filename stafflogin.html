<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TMR Staff Login | WhatsApp OTP</title>
        <link rel="icon" type="image/png" href="logo.png" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

        <style>
            :root {
                --mint-dark: #006c9c;
                --bg: #f4f9fb;
            }
            body {
                background: var(--bg);
                font-family: "Segoe UI", sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .card {
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }
            .btn-primary {
                background-color: var(--mint-dark);
                border-color: var(--mint-dark);
            }
            .btn-primary:hover {
                background-color: #3ba18d;
                border-color: #3ba18d;
            }
            footer {
                position: absolute;
                bottom: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.3);
                color: white;
                text-align: center;
                font-size: 0.9rem;
                padding: 1rem 0;
                backdrop-filter: blur(10px);
            }
            .fade-out {
                opacity: 0;
                transition: opacity 0.5s ease-in;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card p-4">
                        <div class="text-center mb-3">
                            <img src="assets/images/favicon.png" alt="TMR Logo" height="60" />
                            <h3 class="mt-3 mb-2 text-uppercase fw-bold text-primary">TMR Staff Login</h3>
                            <p class="text-muted">Login using your WhatsApp number</p>
                        </div>

                        <div id="step1">
                            <input type="text" id="firstName" class="form-control mb-3" placeholder="First Name" required />
                            <input type="text" id="lastName" class="form-control mb-3" placeholder="Last Name" required />
                            <input type="email" id="email" class="form-control mb-3" placeholder="E-Mail" required />
                            <input type="tel" id="phone" class="form-control mb-3" placeholder="WhatsApp Phone (e.g., +256...)" required />
                            <div id="recaptcha-container" class="mb-3"></div>
                            <button onclick="sendOTP()" class="btn btn-primary w-100">Send OTP</button>
                        </div>

                        <div id="step2" style="display: none;">
                            <input type="text" id="otp" class="form-control mb-3" placeholder="Enter OTP" required />
                            <button onclick="verifyOTP()" class="btn btn-primary w-100">Verify & Login</button>
                        </div>

                        <div class="text-center mt-3">
                            <small>Not registered? <a href="staffintro.html" class="text-decoration-none fw-semibold">Register here</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 TMR ConnectedCare | Powered by Toli Wekka. <a href="#">Privacy</a> | <a href="#">Terms</a></p>
        </footer>

<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDeDsOiA6QP4qbedd_JmQ9na1hM3sf4y3Q",
        authDomain: "mentalhealthtracker-15563.firebaseapp.com",
        projectId: "mentalhealthtracker-15563",
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let confirmationResult;

    // Ensure DOM is loaded
    window.onload = () => {
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier("recaptcha-container", {
            size: "normal",
            callback: (response) => {
                console.log("Recaptcha verified ✅");
            },
            "expired-callback": () => {
                alert("Recaptcha expired. Please refresh the page.");
            }
        });

        // Ensure recaptcha renders properly
        recaptchaVerifier.render().then((widgetId) => {
            window.recaptchaWidgetId = widgetId;
        });
    };

    // Send OTP to the user's phone
    function sendOTP() {
        const phone = document.getElementById("phone").value.trim();
        if (!phone.startsWith("+")) {
            alert("Please enter a valid international phone number starting with '+'.");
            return;
        }

        auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
            .then((result) => {
                confirmationResult = result;
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
                alert("OTP sent via SMS to your phone.");
            })
            .catch((error) => {
                console.error("Error sending OTP:", error);
                alert("Failed to send OTP: " + error.message);
                grecaptcha.reset(window.recaptchaWidgetId); // Reset ReCAPTCHA on failure
            });
    }

    // Verify the OTP code and fetch user data
    function verifyOTP() {
        const otp = document.getElementById("otp").value.trim();
        const first = document.getElementById("firstName").value.trim();
        const last = document.getElementById("lastName").value.trim();
        const email = document.getElementById("email").value.trim();

        if (!otp || !first || !last || !email) {
            alert("Please fill in all fields.");
            return;
        }

        confirmationResult
            .confirm(otp)
            .then((result) => {
                const user = result.user;
                console.log("User signed in:", user.phoneNumber);

                db.collection("tmrRegister")
                    .where("form_005_first-name", "==", first)
                    .where("form_006_surname", "==", last)
                    .where("form_007_email", "==", email)
                    .get()
                    .then((snapshot) => {
                        if (snapshot.empty) {
                            alert("No matching assessment records found.");
                            return;
                        }

                        const docData = snapshot.docs[0].data();
                        localStorage.clear();
                        for (const key in docData) {
                            localStorage.setItem(key, docData[key]);
                        }

                        document.body.classList.add("fade-out");
                        setTimeout(() => {
                            window.location.href = "userlandingpage.html";
                        }, 500);
                    })
                    .catch((err) => {
                        console.error("Firestore query error:", err);
                        alert("Error loading user profile: " + err.message);
                    });
            })
            .catch((err) => {
                console.error("OTP verification failed:", err);
                alert("Invalid OTP. Please try again.");
            });
    }
</script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
