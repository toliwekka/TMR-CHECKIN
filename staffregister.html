        <style>
            :root {
                --tmr-blue: #0f2f5f;
                --tmr-accent: #1f6aa5;
                --dark-bg: #1a1a1a;
                --dark-text: #eaeaea;
            }
            body {
                font-family: "Poppins", sans-serif;
                background-color: #f4f6f9;
                transition: background-color 0.3s ease;
            }
            body.dark {
                background-color: var(--dark-bg);
                color: var(--dark-text);
            }
            body.dark input,
            body.dark select,
            body.dark .select2-selection {
                background-color: #2b2b2b !important;
                color: var(--dark-text) !important;
                border-color: #444 !important;
            }
            .form-section {
                margin-bottom: 2rem;
            }
            header {
                background-color: var(--tmr-blue);
                color: white;
                padding: 1rem;
                font-size: 1.75rem;
                text-align: center;
                letter-spacing: 0.5px;
            }
            .card {
                border: none;
                border-radius: 1rem;
                box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
                padding: 2rem;
            }
            .section-title {
                font-size: 1.2rem;
                font-weight: 600;
                color: var(--tmr-blue);
                border-bottom: 2px solid var(--tmr-accent);
                padding-bottom: 0.3rem;
                margin-bottom: 1rem;
            }
            .theme-toggle {
                position: fixed;
                top: 1rem;
                right: 1rem;
                z-index: 1000;
            }
            .select2-container--default .select2-selection--single {
                height: 38px;
                padding: 6px 10px;
                border-radius: 0.375rem;
            }
            .form-control:focus,
            .form-select:focus {
                border-color: var(--tmr-accent);
                box-shadow: 0 0 0 0.2rem rgba(31, 106, 165, 0.25);
            }
            .btn-primary {
                background-color: var(--tmr-blue);
                border: none;
            }
            .btn-outline-secondary {
                border-color: var(--tmr-blue);
                color: var(--tmr-blue);
            }
            .btn-outline-secondary:hover {
                background-color: var(--tmr-blue);
                color: white;
            }
            .floating-label {
                position: relative;
            }
            .floating-label input,
            .floating-label select {
                padding-top: 1.5rem;
            }
            .floating-label label {
                position: absolute;
                top: 0.5rem;
                left: 0.75rem;
                font-size: 0.8rem;
                color: #6c757d;
                transition: all 0.2s ease;
                pointer-events: none;
            }
            .floating-label input:focus + label,
            .floating-label select:focus + label,
            .floating-label input:not(:placeholder-shown) + label,
            .floating-label select:not(:placeholder-shown) + label {
                top: -0.5rem;
                font-size: 0.7rem;
                color: var(--tmr-accent);
            }
        </style>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

        <style>
            body {
                font-family: "Poppins", sans-serif;
                background: linear-gradient(to right, #e9f1f7, #f7f9fb);
                padding: 2rem;
            }
            .form-section {
                margin-bottom: 2.5rem;
                padding: 2rem;
                background-color: #fff;
                border-radius: 1rem;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
                transition: all 0.3s ease-in-out;
            }
            .form-section:hover {
                transform: scale(1.01);
            }
            .section-title {
                font-size: 1.3rem;
                font-weight: 600;
                color: #0f2f5f;
                border-bottom: 3px solid #1f6aa5;
                padding-bottom: 0.5rem;
                margin-bottom: 1.5rem;
            }
            header {
                background: #0f2f5f;
                color: #fff;
                padding: 1.5rem;
                text-align: center;
                font-size: 2rem;
                font-weight: 600;
                border-radius: 1rem;
                margin-bottom: 2rem;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }
            label {
                font-weight: 500;
            }
            .btn-primary {
                background-color: #1f6aa5;
                border: none;
                transition: background-color 0.3s;
            }
            .btn-primary:hover {
                background-color: #155b89;
            }
            .form-floating > label {
                padding-left: 0.75rem;
            }
            .select2-container .select2-selection--single {
                height: 58px !important;
                padding: 12px;

            }

                top: 15px;

            .theme-toggle {
                position: fixed;
                top: 1rem;
                right: 1rem;

        </style>

            <header><i class="fas fa-user-nurse me-2"></i>TMR Staff Registration</header>

                                        <option value="House Keeping Unit">House Keeping Unit</option>
                                        <option value="Security Unit">Security Unit</option>
                                        <option value="Café Lazat">Café Lazat</option>

                                        <option value="Nurses">Nurses</option>
                                        <option value="Pharmacy Unit">Pharmacy Unit</option>
                                        <option value="Finance Unit">Finance Unit</option>
                                        <option value="Quality Assurance">Quality Assurance</option>
                                        <option value="IT Unit">IT Unit</option>
                                        <option value="Customer Care">Customer Care</option>
                                        <option value="HR Unit">HR Unit</option>

                                    </select>

                                </div>

                                            <option value="Consultant Surgeon">Consultant Surgeon</option>
                                            <option value="Medical Officer">Medical Officer</option>
                                            <option value="Clinical Officer">Clinical Officer</option>
                                            <option value="Resident Doctor">Resident Doctor</option>
                                            <option value="Dentist">Dentist</option>
                                            <option value="Anesthetist">Anesthetist</option>
                                            <option value="Pharmacist">Pharmacist</option>
                                            <option value="Nurse">Nurse</option>
                                            <option value="Midwife">Midwife</option>
                                            <option value="Radiologist">Radiologist</option>
                                            <option value="Physiotherapist">Physiotherapist</option>

                                        <!-- Administrative & Management -->

                                            <option value="Chief Executive Officer">Chief Executive Officer (CEO)</option>
                                            <option value="Hospital Director">Hospital Director</option>
                                            <option value="Medical Director">Medical Director</option>
                                            <option value="Operations Manager">Operations Manager</option>
                                            <option value="Finance & Accounts Manager">Finance & Accounts Manager</option>
                                            <option value="Human Resources Manager">Human Resources Manager</option>
                                            <option value="Customer Relations Officer">Customer Relations Officer</option>
                                            <option value="Public Relations Officer">Public Relations Officer</option>
                                            <option value="Insurance & Billing Officer">Insurance & Billing Officer</option>
                                        </optgroup>

                                        <!-- Support & Operations -->
                                        <optgroup label="Support & Operations">
                                            <option value="Housekeeping Attendant">Housekeeping Attendant</option>
                                            <option value="Security Officer">Security Officer</option>
                                            <option value="Maintenance Officer">Maintenance Officer</option>
                                            <option value="Ambulance Driver">Ambulance Driver</option>

                                            <option value="Catering Manager">Catering Manager</option>

                                            <option value="Dental Assistant">Dental Assistant</option>

                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="section-title" id="sectionHeader">Staff Information</div>
                            <div class="row g-3">
                                <div class="col-md-6 floating-label">
                                    <select class="form-select" id="004_title" required>
                                        <optgroup label="Common">
                                            <option value="" selected disabled>Select Salutation...</option>
                                            <option value="Mr.">Mr.</option>
                                            <option value="Mrs.">Mrs.</option>
                                            <option value="Miss">Miss</option>
                                            <option value="Ms.">Ms.</option>

                                        </optgroup>

                                </div>
                                <div class="col-md-6 floating-label">
                                    <input class="form-control" id="006_surname" placeholder=" " required />

                                </div>
                                <div class="col-md-6 floating-label">
                                    <div class="input-group">
                                        <span class="input-group-text">+256</span>
                                        <input type="tel" class="form-control" id="008_phone" placeholder="7XXXXXXXX" pattern="[0-9]{9}" required />
                                        <label for="008_phone" class="form-label"><i class="fa fa-phone me-1"></i> Phone</label>

                                </div>
                                <div class="col-md-4 floating-label">

                                    </select>

                                </div>
                                <div class="col-md-4 floating-label">

                                            <option value="" selected disabled>Select...</option>

                                            <option>Married</option>

                                </div>

                                <div class="col-md-4 floating-label">

                                    <label for="013_family-type"> <i class="fa fa-users me-1"></i> Family Type </label>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">

                        <div class="form-section">
                            <div class="section-title">Mode: <span id="entryMode">Staff</span></div>
                            <div class="row g-3 align-items-end" id="relationshipRow" style="display: none;">
                                <div class="col-md-6 floating-label">
                                    <select class="form-select" id="famRelation">

                                        <option>Spouse</option>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const inputs = document.querySelectorAll("input, textarea, select");

                // Utility: Generate unique IDs
                const generateUniqueID = (prefix) => {
                    const now = new Date();
                    const datePart = now
                        .toISOString()
                        .replace(/[-:.TZ]/g, "")
                        .slice(0, 14);
                    const randomPart = Math.random().toString(36).substr(2, 3).toUpperCase();
                    return `${prefix}-${datePart}-${randomPart}`;
                };

                // Define keys for unique IDs and default values
                const keys = {
                    timestamp: "form_000_evaluationDate",
                    staffID: "form_000_00_StaffID",
                    familyMemberID: "form_000_01_FamilyMemberID",
                    notificationsID: "form_062_NotificationID",
                    upcomingEventsID: "form_063_UpcomingEventsID",
                    smartGoalsID: "form_064_smartGoalsID",
                    schedulerID: "form_065_schedulerID",
                    order: "form_field_order",
                };

                // Initialize unique IDs
                const initID = (key, generator, prefix) => {
                    if (!localStorage.getItem(key)) {
                        const id = generator(prefix);
                        localStorage.setItem(key, id);
                    }
                };

                initID(keys.staffID, generateUniqueID, "TMR-STAFF");
                initID(keys.familyMemberID, (prefix) => `${localStorage.getItem(keys.staffID)}-000`, "");
                initID(keys.notificationsID, generateUniqueID, "NOTIF");
                initID(keys.upcomingEventsID, generateUniqueID, "EVENT");
                initID(keys.smartGoalsID, generateUniqueID, "SMART");
                initID(keys.schedulerID, generateUniqueID, "SCHED");

                // Initialize timestamp
                if (!localStorage.getItem(keys.timestamp)) {
                    localStorage.setItem(keys.timestamp, new Date().toISOString());
                }

                // Restore and save input field values
                inputs.forEach((input) => {
                    const key = `form_${input.id || input.name}`;
                    const savedValue = localStorage.getItem(key);

                    if (savedValue !== null) {
                        if (input.type === "checkbox") {
                            input.checked = savedValue === "true";
                        } else {
                            input.value = savedValue;
                        }
                    }

                    const saveValue = () => {
                        const value = input.type === "checkbox" ? input.checked : input.value.trim();
                        localStorage.setItem(key, value);
                    };

                    input.addEventListener("input", saveValue);
                    input.addEventListener("change", saveValue);
                    input.addEventListener("blur", saveValue);
                });

                // Monitor changes with MutationObserver
                const observer = new MutationObserver(() => {
                    inputs.forEach((input) => {
                        const key = `form_${input.id || input.name}`;
                        const value = input.type === "checkbox" ? input.checked : input.value.trim();
                        localStorage.setItem(key, value);
                    });
                });

                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    characterData: true,
                });
            });
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const allFields = Array.from(document.querySelectorAll("input, textarea, select"));

                // Sort fields by ID (or name if no ID)
                const sortedFields = allFields.sort((a, b) => {
                    const aKey = a.id || a.name || "";
                    const bKey = b.id || b.name || "";
                    return aKey.localeCompare(bKey);
                });

                const saveToStorage = (input) => {
                    const key = `form_${input.id || input.name}`;
                    const value = input.type === "checkbox" ? input.checked : input.value.trim();
                    localStorage.setItem(key, value);
                };

                // On load: Restore and immediately store current values
                sortedFields.forEach((input) => {
                    const key = `form_${input.id || input.name}`;
                    const savedValue = localStorage.getItem(key);

                    // If value exists in storage, restore it
                    if (savedValue !== null) {
                        if (input.type === "checkbox") {
                            input.checked = savedValue === "true";
                        } else {
                            input.value = savedValue;
                        }
                    }

                    // Save current value to storage (even untouched)
                    saveToStorage(input);

                    // Add event listeners to keep saving changes
                    input.addEventListener("input", () => saveToStorage(input));
                    input.addEventListener("change", () => saveToStorage(input));
                    input.addEventListener("blur", () => saveToStorage(input));
                });

                // MutationObserver: capture dynamically added inputs
                const observer = new MutationObserver(() => {
                    const dynamicFields = Array.from(document.querySelectorAll("input, textarea, select"));
                    dynamicFields.forEach((input) => saveToStorage(input));
                });

                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                });
            });
        </script>

            // ✅ Function to send data to Firestore

                const data = {};

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith("form_0")) {
                        data[key] = localStorage.getItem(key);
                    }
                }

                const customDocID = localStorage.getItem("form_000_00_StaffID");
                if (!customDocID) {

                await db.collection("tmrRegister").doc(customDocID).set(data);
                console.log("✅ Firestore: Data saved under ID:", customDocID);
            }

            document.addEventListener("DOMContentLoaded", () => {
                const form = document.querySelector("form"); // Make sure your form tag exists

                if (!form) {

                    return;
                }

                form.addEventListener("submit", async (e) => {
