<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMR T|Check Landing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bs-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .theme-switcher {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
    }

    .hero-description {
      transition: opacity 0.5s ease;
    }

    .card-button {
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
    }

    footer {
      background-color: #f8f9fa;
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- Theme Selector -->
  <div class="theme-switcher">
    <select id="themeSelect" class="form-select">
      <option value="default" selected>TMR</option>
      <option value="fieryRed">🔥 Fiery Red</option>
      <option value="midnightDark">🌚 Midnight Dark</option>
      <option value="oceanBreeze">🌊 Ocean Breeze</option>
    </select>
  </div>

  <!-- Main Content -->
  <main class="container text-center my-auto py-5">
    <img src="logo.png" alt="TMR Logo" class="mb-3" style="max-height: 80px;" />
    <h1 class="mb-3 fw-bold" style="color: var(--bs-primary);">TMR T|Check</h1>
    <p id="hero-description" class="lead mb-5 px-3 hero-description" style="max-width: 600px; margin: auto;">
      Starting your wellness transformation with T|Check...
    </p>

    <div class="row justify-content-center g-4">
      <div class="col-12 col-md-5">
        <div class="card h-100 shadow card-button" onclick="location.href='portal.html'">
          <div class="card-body py-5">
            <i class="bi bi-person-circle display-4 mb-3"></i>
            <h4 class="card-title">Enter My Portal</h4>
            <p class="card-text">Access your dashboard, insights, and progress history.</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-5">
        <div class="card h-100 shadow card-button" onclick="location.href='register.html'">
          <div class="card-body py-5">
            <i class="bi bi-clipboard-check display-4 mb-3"></i>
            <h4 class="card-title">Take an Assessment</h4>
            <p class="card-text">Begin your self-discovery with our mental wellness tool.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; TMR International | Powered by Toli Wekka |
    <a href="#">Privacy</a> |
    <a href="#">Terms</a>
  </footer>

  <!-- JS -->
  <script>
    const heroDescriptions = [
      "Start your TMR journey today — because your mental health deserves the spotlight.",
      "Get personalized insights into your well-being with TMR, and start transforming today.",
      "Take the first step toward a balanced mind with TMR, your mental wellness ally.",
      "Transform how you see yourself with TMR — because mental clarity changes everything."
    ];

    let heroIndex = 0;
    const heroEl = document.getElementById("hero-description");

    setInterval(() => {
      heroEl.style.opacity = 0;
      setTimeout(() => {
        heroEl.textContent = heroDescriptions[heroIndex];
        heroEl.style.opacity = 1;
        heroIndex = (heroIndex + 1) % heroDescriptions.length;
      }, 500);
    }, 5000);

    // Minimal theme simulation
    const themes = {
      default: { "--bs-primary": "#0d6efd" },
      fieryRed: { "--bs-primary": "#dc3545" },
      midnightDark: { "--bs-primary": "#212529" },
      oceanBreeze: { "--bs-primary": "#17a2b8" }
    };

    const themeSelect = document.getElementById("themeSelect");

    function applyTheme(themeName) {
      const theme = themes[themeName];
      if (!theme) return;
      Object.keys(theme).forEach(key => {
        document.documentElement.style.setProperty(key, theme[key]);
      });
    }

    themeSelect.addEventListener("change", (e) => {
      applyTheme(e.target.value);
    });

    // Apply default theme on load
    applyTheme(themeSelect.value);
  </script>
</body>
</html>
