<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMR T|Check Landing</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --tmr-primary: #0f2f5f;
      --tmr-accent: #1f6aa5;
      --tmr-light: #f0f8ff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom right, var(--tmr-primary), var(--tmr-accent));
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .theme-switcher {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
    }

    .card-button {
      cursor: pointer;
      border: none;
      border-radius: 15px;
      background-color: #1e3a8a;
      color: white;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    h1, h4 {
      color: var(--tmr-light);
    }

    .hero-description {
      color: #e0f0ff;
      font-weight: 300;
      font-size: 1.25rem;
      transition: opacity 0.5s ease;
    }

    footer {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }

    a {
      color: #ffc107;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="theme-switcher">
    <select id="themeSelect" class="form-select">
      <option value="default" selected>TMR</option>
      <option value="fieryRed">🔥 Fiery Red</option>
      <option value="midnightDark">🌚 Midnight Dark</option>
      <option value="oceanBreeze">🌊 Ocean Breeze</option>
    </select>
  </div>

  <main class="container text-center my-auto py-5">
    <img src="logo.png" alt="TMR Logo" class="mb-3" style="max-height: 90px;" />
    <h1 class="fw-bold">Welcome to T|Check</h1>
    <p id="hero-description" class="hero-description mb-5 px-3" style="max-width: 700px; margin: auto;">
      Start your wellness transformation with TMR...
    </p>

    <div class="row justify-content-center g-4">
      <div class="col-12 col-md-5">
        <div class="card card-button p-4 shadow" onclick="location.href='staffportal.html'">
          <div class="card-body">
            <i class="bi bi-person-circle display-4 mb-3"></i>
            <h4 class="card-title">Enter My Portal</h4>
            <p class="card-text">Access your dashboard, insights, and mental health scores.</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-5">
        <div class="card card-button p-4 shadow" onclick="location.href='staffregister.html'">
          <div class="card-body">
            <i class="bi bi-clipboard-check display-4 mb-3"></i>
            <h4 class="card-title">Take an Assessment</h4>
            <p class="card-text">Begin your self-check using our guided tool.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; TMR International | Powered by Toli Wekka |
    <a href="#">Privacy</a> |
    <a href="#">Terms</a>
  </footer>

  <script>
    const heroDescriptions = [
      "Start your TMR journey today — because your mental health deserves the spotlight.",
      "Get personalized insights into your well-being with TMR, and start transforming today.",
      "Take the first step toward a balanced mind with TMR, your mental wellness ally.",
      "Transform how you see yourself with TMR — because mental clarity changes everything."
    ];

    let heroIndex = 0;
    const heroEl = document.getElementById("hero-description");

    setInterval(() => {
      heroEl.style.opacity = 0;
      setTimeout(() => {
        heroEl.textContent = heroDescriptions[heroIndex];
        heroEl.style.opacity = 1;
        heroIndex = (heroIndex + 1) % heroDescriptions.length;
      }, 500);
    }, 5000);

    const themes = {
      default: { "--tmr-primary": "#0f2f5f", "--tmr-accent": "#1f6aa5" },
      fieryRed: { "--tmr-primary": "#b91c1c", "--tmr-accent": "#ef4444" },
      midnightDark: { "--tmr-primary": "#111827", "--tmr-accent": "#374151" },
      oceanBreeze: { "--tmr-primary": "#0ea5e9", "--tmr-accent": "#38bdf8" }
    };

    const themeSelect = document.getElementById("themeSelect");

    function applyTheme(themeName) {
      const theme = themes[themeName];
      if (!theme) return;
      Object.keys(theme).forEach(key => {
        document.documentElement.style.setProperty(key, theme[key]);
      });
    }

    themeSelect.addEventListener("change", (e) => applyTheme(e.target.value));
    applyTheme(themeSelect.value);
  </script>
</body>
</html>
